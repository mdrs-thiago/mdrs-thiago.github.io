<text x="815.0" y="258.0" font-size="24" fill="#333333" text-anchor="start" font-weight="normal" font-style="italic" >f</text>
<text x="190.0" y="112.0" font-size="17" fill="#047857" text-anchor="middle" font-weight="bold" font-style="normal" >x = −2</text>
<text x="190.0" y="192.0" font-size="17" fill="#047857" text-anchor="middle" font-weight="bold" font-style="normal" >y = 5</text>
<text x="470.0" y="186.0" font-size="17" fill="#047857" text-anchor="middle" font-weight="bold" font-style="normal" >q = 3</text>
<text x="330.0" y="288.0" font-size="17" fill="#047857" text-anchor="middle" font-weight="bold" font-style="normal" >z = −4</text>
<text x="730.0" y="238.0" font-size="17" fill="#047857" text-anchor="middle" font-weight="bold" font-style="normal" >f = −12</text>
<text x="190.0" y="160.0" font-size="17" fill="#e53e3e" text-anchor="middle" font-weight="bold" font-style="normal" >∂f/∂x = −4</text>
<text x="190.0" y="240.0" font-size="17" fill="#e53e3e" text-anchor="middle" font-weight="bold" font-style="normal" >∂f/∂y = −4</text>
<text x="480.0" y="242.0" font-size="17" fill="#e53e3e" text-anchor="middle" font-weight="bold" font-style="normal" >∂f/∂q = z = −4</text>
<text x="330.0" y="336.0" font-size="17" fill="#e53e3e" text-anchor="middle" font-weight="bold" font-style="normal" >∂f/∂z = q = 3</text>
<text x="730.0" y="278.0" font-size="17" fill="#e53e3e" text-anchor="middle" font-weight="bold" font-style="normal" >∂f/∂f = 1</text>
