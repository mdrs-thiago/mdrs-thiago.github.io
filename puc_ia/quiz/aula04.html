<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Aula 04 — No-Code e Low-Code | PI-IA · PUC-Rio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../../js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../css/base.css">
</head>
<body class="font-sans antialiased flex flex-col min-h-screen">

    <nav class="fixed w-full top-0 z-50 nav-blur border-b">
        <div class="max-w-3xl mx-auto px-6">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3 text-sm">
                    <a href="../slides/aula04.html" class="hover:opacity-70 transition-opacity"><i class="fas fa-arrow-left mr-1"></i> Aula 04</a>
                    <span style="color:var(--ink-faint)">/</span>
                    <span class="font-medium">Quiz</span>
                </div>
                <a href="../../disciplinas/puc-pi-ia.html" class="text-xs" style="color:var(--ink-faint)">PI — Introdução à IA</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-28 pb-20">
        <div class="max-w-3xl mx-auto px-6">
            <div class="mb-8">
                <span class="eyebrow">Aula 04 &middot; Quiz</span>
                <h1 class="font-serif text-2xl lg:text-3xl font-semibold mt-2">No-Code e Low-Code</h1>
                <p class="prose-editorial mt-3"><span>6 perguntas sobre no-code/low-code, por que n8n, e como versionar workflows. Resultado calculado na hora.</span></p>
            </div>

            <div id="identity-panel" class="editorial-card p-5 mb-6 text-sm" style="color:var(--ink-muted)">Identificando...</div>

            <div id="locked-panel" class="hidden"></div>

            <form id="quiz-form" class="hidden space-y-6"></form>

            <div id="result-panel" class="hidden mt-8"></div>
        </div>
    </main>

    <footer class="site-footer py-10 border-t no-print">
        <div class="max-w-3xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-sm">
            <span class="font-serif">Thiago Medeiros</span>
            <span class="byline">Pontifícia Universidade Católica do Rio de Janeiro</span>
        </div>
    </footer>

    <script src="../../js/config.js"></script>
    <script src="../../js/quest-submit.js"></script>
    <script>
        const DISCIPLINA = 'puc-pi-ia';
        const QUEST_ID = 'pi-ia-a4-quiz';

        const QUESTIONS = [
            {
                q: 'Qual a principal diferença entre no-code e low-code, segundo a aula?',
                options: [
                    'No-code permite código customizado; low-code não permite nada além do visual',
                    'No-code é zero código (tudo pronto, arrastar-e-soltar); low-code é visual, mas permite código customizado onde falta flexibilidade',
                    'São exatamente a mesma coisa, só o nome muda',
                    'Low-code só funciona hospedado na nuvem'
                ],
                correct: 1
            },
            {
                q: 'Qual vantagem do n8n foi destacada na aula, em comparação com Zapier/Make?',
                options: [
                    'Tem um catálogo maior de integrações prontas',
                    'É open-source e self-hosted, sem custo por execução, com nó de código embutido',
                    'É mais simples de usar, mas cobra por uso',
                    'Não consegue chamar LLMs'
                ],
                correct: 1
            },
            {
                q: 'O que compõe a anatomia básica de um workflow no n8n?',
                options: [
                    'Apenas um nó de LLM, sem entrada nem saída',
                    'Trigger (o que inicia o fluxo), Processamento (nós de lógica/LLM) e Saída (o que o fluxo produz)',
                    'Somente webhooks, sem qualquer processamento',
                    'Um banco de dados e nada mais'
                ],
                correct: 1
            },
            {
                q: 'O que o nó "HTTP Request" do n8n faz, tecnicamente, ao chamar um LLM local?',
                options: [
                    'Executa o modelo diretamente dentro do n8n, sem rede',
                    'Faz a mesma chamada HTTP (ex.: POST para localhost:11434/api/generate) que você faria via curl ou código, só que configurada numa interface visual',
                    'Só funciona com modelos pagos na nuvem',
                    'Substitui a necessidade de ter um LLM rodando'
                ],
                correct: 1
            },
            {
                q: 'Segundo a aula, qual é um limite real do low-code, mesmo sendo mais rápido para prototipar?',
                options: [
                    'Workflows exportados são mais difíceis de revisar/versionar de forma tão direta quanto um arquivo de código num Pull Request',
                    'Não é possível editar nada depois de criado',
                    'Não aceita nenhuma lógica condicional',
                    'Não pode ser usado em nenhum projeto real'
                ],
                correct: 0
            },
            {
                q: 'Qual a recomendação da aula sobre versionar workflows do n8n no projeto integrado?',
                options: [
                    'Não versionar, já que são visuais',
                    'Exportar como JSON e commitar no repositório, junto com o resto do código do projeto',
                    'Guardar só localmente, sem compartilhar com o time',
                    'Recriar o workflow do zero toda vez que alguém mais no time precisar dele'
                ],
                correct: 1
            }
        ];

        function renderIdentity(aluno) {
            const el = document.getElementById('identity-panel');
            if (!aluno) {
                el.innerHTML = `<div class="flex items-center justify-between gap-3">
                    <span>Não foi possível identificar sua matrícula.</span>
                    <button onclick="location.reload()" class="btn-outline px-4 py-2 text-xs font-medium">Tentar de novo</button>
                </div>`;
                return;
            }
            el.innerHTML = `<span>${aluno.nome ? `Oi, ${aluno.nome}!` : `Matrícula ${aluno.id}`} Suas respostas serão registradas para a disciplina.</span>`;
        }

        function renderLocked(detalhe) {
            const el = document.getElementById('locked-panel');
            el.classList.remove('hidden');
            el.innerHTML = `<div class="locked-panel">
                <i class="fas fa-circle-check text-2xl mb-3" style="color:var(--accent)"></i>
                <p class="font-medium">Você já respondeu este quiz.</p>
                <p class="text-sm mt-1" style="color:var(--ink-muted)">Sua nota registrada: <strong>${detalhe || '—'}</strong></p>
            </div>`;
        }

        function renderQuiz() {
            const form = document.getElementById('quiz-form');
            form.classList.remove('hidden');
            form.innerHTML = QUESTIONS.map((item, qi) => `
                <div class="editorial-card p-5">
                    <p class="text-sm font-medium mb-3 px-1">${qi + 1}. ${item.q}</p>
                    <div class="space-y-2">
                        ${item.options.map((opt, oi) => `
                            <label class="quiz-option" data-q="${qi}" data-o="${oi}">
                                <input type="radio" name="q${qi}" value="${oi}">
                                <span class="text-sm">${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('') + `<button type="submit" class="btn-accent px-6 py-3 text-sm font-medium">Enviar respostas</button>`;

            form.querySelectorAll('.quiz-option').forEach(label => {
                label.addEventListener('click', () => {
                    const qi = label.dataset.q;
                    form.querySelectorAll(`.quiz-option[data-q="${qi}"]`).forEach(l => l.classList.remove('selected'));
                    label.classList.add('selected');
                });
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const unanswered = QUESTIONS.some((_, qi) => !form.querySelector(`input[name="q${qi}"]:checked`));
                if (unanswered) {
                    alert('Responda todas as perguntas antes de enviar.');
                    return;
                }

                let score = 0;
                QUESTIONS.forEach((item, qi) => {
                    const chosen = parseInt(form.querySelector(`input[name="q${qi}"]:checked`).value, 10);
                    const isCorrect = chosen === item.correct;
                    if (isCorrect) score++;
                    const chosenLabel = form.querySelector(`.quiz-option[data-q="${qi}"][data-o="${chosen}"]`);
                    chosenLabel.classList.add(isCorrect ? 'correct' : 'incorrect');
                    chosenLabel.classList.add('disabled');
                    chosenLabel.insertAdjacentHTML('beforeend', `<span class="quiz-mark ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '✓ Certo' : '✗ Errado'}</span>`);
                });

                form.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
                form.querySelectorAll('.quiz-option').forEach(l => l.classList.add('disabled'));
                form.querySelector('button[type="submit"]').remove();

                const detalhe = `${score}/${QUESTIONS.length}`;
                const resultEl = document.getElementById('result-panel');
                resultEl.classList.remove('hidden');
                resultEl.innerHTML = `<div class="locked-panel">
                    <p class="text-2xl font-serif font-semibold">${detalhe}</p>
                    <p class="text-sm mt-1" style="color:var(--ink-muted)">Resultado salvo.</p>
                </div>`;

                if (window.__questAluno) {
                    const res = await QuestSubmit.submit(DISCIPLINA, window.__questAluno.id, QUEST_ID, detalhe);
                    if (res.status === 'duplicate') {
                        resultEl.querySelector('p.text-sm').textContent = `Já havia uma resposta registrada: ${res.detalhe}`;
                    } else if (res.status === 'no_backend' || res.status === 'error') {
                        resultEl.querySelector('p.text-sm').textContent = 'Não foi possível salvar o resultado agora — anote sua nota e avise o professor se persistir.';
                    }
                }
            });
        }

        async function init() {
            const aluno = await QuestSubmit.getAlunoId(DISCIPLINA);
            window.__questAluno = aluno;
            renderIdentity(aluno);
            if (!aluno) return;

            const status = await QuestSubmit.checkStatus(DISCIPLINA, aluno.id, QUEST_ID);
            if (status.done) {
                renderLocked(status.detalhe);
                return;
            }
            renderQuiz();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
